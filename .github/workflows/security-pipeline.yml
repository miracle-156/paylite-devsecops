name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secrets-scan:
    name: TruffleHog - Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified=false --fail

  sast-bandit:
    name: Bandit - Python SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit (fail on HIGH severity)
        run: bandit -r . -lll -x ./.github

  dependency-safety:
    name: Safety - Dependency CVE Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Safety
        run: pip install safety
      - name: Run Safety
        run: safety check -r requirements.txt

  container-trivy:
    name: Trivy - Docker Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t payliteng:pipeline .
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: payliteng:pipeline
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  iac-checkov:
    name: Checkov - Terraform IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: false
          check: CKV_AWS_16,CKV_AWS_17,CKV_AWS_20,CKV_AWS_24,CKV_AWS_25,CKV_AWS_36,CKV_AWS_277,CKV_AWS_382
